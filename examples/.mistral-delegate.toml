# mistral-delegate settings for this project.
# Copy this file to your repository root as .mistral-delegate.toml and adjust it.
# Check the effective settings with: /delegate-mistral config

# How much Claude hands to Mistral:
#   conservative - tests, docs, boilerplate and read-only searches only
#   balanced     - any step with a short spec and an automatic check
#   aggressive   - every such step by default, in parallel
policy = "balanced"

# Checks the wrapper runs after every write task. A failing check is sent back
# to Mistral for a fix. Keep them fast; they run once per attempt.
# Set up here for Node/TypeScript. For other stacks, replace with e.g.:
#   Python: ["pytest -q", "ruff check ."]
#   Go:     ["go test ./...", "go vet ./..."]
#   Rust:   ["cargo test", "cargo clippy -- -D warnings"]
# A check can be limited to paths: it then runs only when the task's --scope or
# Mistral's changes touch them (saves running backend tests for a frontend task).
verify = [
  "npm test",
  "npx tsc --noEmit",
  # { cmd = "pytest -q", paths = ["backend/"] },
]

# Commands Mistral may run itself while it works, so it can fix its own
# mistakes before handing back. These are prefixes: "npm test" also allows
# "npm test -- src/foo.test.ts", and common spellings are accepted too
# ("npm run test", "pnpm test", "npx vitest" when the test script runs vitest).
# Anything not listed is refused, with an explanation Mistral can act on.
allow_commands = ["npm test", "npx tsc --noEmit"]
# Tip: the report's denied_commands section (and --stats) shows commands Mistral
# tried but wasn't allowed to run; add the useful ones here.

# How many times a failing check goes back to Mistral (0 turns this off).
fix_attempts = 1

# Maximum number of Mistral tasks running at the same time.
max_parallel = 3

# How dependency folders (node_modules, .venv, ...) get into Mistral's worktree:
#   hardlink - real folders whose files are shared with your checkout (default;
#              fast, and tools like Vite accept them)
#   copy     - full independent copy (slow for big folders)
#   symlink  - a link to your checkout's folder (instant, but Vite rejects files
#              that resolve outside the project)
#   none     - nothing
deps_mode = "hardlink"

# Where Mistral's worktrees go. Keep them on the same disk as the repo, or
# dependency hard links fall back to symlinks (which break Vite/vitest mocks).
# Default: ~/.mistral-delegate/worktrees, or <repo parent>/.mistral-worktrees
# when the repo is on another disk.
# worktrees_dir = "/Volumes/SSD/Projects/.mistral-worktrees"

# Run the checks once on the untouched worktree before Mistral starts, so
# failures that were already there aren't blamed on Mistral.
baseline = true

# Extra flags for every Vibe call. If reports keep saying "cost unknown",
# this one makes Vibe record exact costs:
# vibe_args = ["--legacy-harness"]

# Model for Mistral's runs: an alias from your Vibe config. If unset, Vibe uses
# its own default, which a server-side experiment may route to a non-Mistral
# model (the report's model: line shows which ran). Pin it to always use Mistral.
model = "mistral-medium-3.5"

# Prices ($ per million tokens: input, output) for models Vibe has no price for,
# so their runs get a cost. Earlier runs are priced from their tokens too.
# model_prices = { "glm-5-3" = [1.0, 4.0] }

# Spending caps per Vibe call. Leave these out to use the policy's defaults
# (balanced: write 30 turns / $1.00, read 15 turns / $0.25).
# Each fix round may spend up to half the write cap again.
[write]
max_turns = 30
max_price = 1.00

[read]
max_turns = 15
max_price = 0.25
