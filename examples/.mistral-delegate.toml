# mistral-delegate settings for this project.
# Copy this file to your repository root as .mistral-delegate.toml and adjust it.
# Check the effective settings with: /delegate-mistral config

# How much Claude hands to Mistral:
#   conservative - tests, docs, boilerplate and read-only searches only
#   balanced     - any step with a short spec and an automatic check
#   aggressive   - every such step by default, in parallel
policy = "balanced"

# Checks the wrapper runs after every write task. A failing check is sent back
# to Mistral for a fix. Keep them fast; they run once per attempt.
# Set up here for Node/TypeScript. For other stacks, replace with e.g.:
#   Python: ["pytest -q", "ruff check ."]
#   Go:     ["go test ./...", "go vet ./..."]
#   Rust:   ["cargo test", "cargo clippy -- -D warnings"]
# A check can be limited to paths: it then runs only when the task's --scope or
# Mistral's changes touch them (saves running backend tests for a frontend task).
verify = [
  "npm test",
  "npx tsc --noEmit",
  # { cmd = "pytest -q", paths = ["backend/"] },
]

# Commands Mistral may run itself while it works, so it can fix its own
# mistakes before handing back. These are prefixes: "npm test" also allows
# "npm test -- src/foo.test.ts", and common spellings are accepted too
# ("npm run test", "pnpm test", "npx vitest" when the test script runs vitest).
# Anything not listed is refused, with an explanation Mistral can act on.
allow_commands = ["npm test", "npx tsc --noEmit"]
# Tip: the report's denied_commands section (and --stats) shows commands Mistral
# tried but wasn't allowed to run; add the useful ones here.

# How many times a failing check goes back to Mistral (0 turns this off).
fix_attempts = 1

# Maximum number of Mistral tasks running at the same time.
max_parallel = 3

# How dependency folders (node_modules, .venv, ...) get into Mistral's worktree:
#   hardlink - real folders (default; tools like Vite accept them): copy-on-write
#              clones where the disk supports it (APFS, Btrfs, XFS), so nothing
#              written in the worktree reaches your checkout; elsewhere hard links
#              whose files are shared with your checkout
#   copy     - full independent copy (slow for big folders)
#   symlink  - a link to your checkout's folder (instant, but Vite rejects files
#              that resolve outside the project)
#   none     - nothing
deps_mode = "hardlink"

# Where Mistral's worktrees go. Keep them on the same disk as the repo, or
# dependency hard links fall back to symlinks (which break Vite/vitest mocks).
# Default: ~/.mistral-delegate/worktrees, or <repo parent>/.mistral-worktrees
# when the repo is on another disk.
# worktrees_dir = "/Volumes/SSD/Projects/.mistral-worktrees"

# Run the checks once on the untouched worktree before Mistral starts, so
# failures that were already there aren't blamed on Mistral.
baseline = true

# Extra flags for every Vibe call. If reports keep saying "usage: unknown",
# this one makes Vibe store token counts in its older session format:
# vibe_args = ["--legacy-harness"]

# Model for Mistral's runs: an alias from your Vibe config. If unset, Vibe uses
# its own default, which a server-side experiment may route to a non-Mistral
# model (the report's model: line shows which ran). Pin it to always use Mistral.
model = "mistral-medium-3.5"

# Prices ($ per million tokens: input, output) for models Vibe has no price for,
# so their runs get a cost. Earlier runs are priced from their tokens too.
# model_prices = { "glm-5-3" = [1.0, 4.0, 0.1] }   # input, output, cached

# Your Mistral Vibe credit per month (e.g. what your subscription includes).
# Reports and the session-start reminder show how much of it is used, so
# Claude delegates freely early in the month and selectively near the end.
# monthly_credit = 225
# currency = "€"
# credit_reset_day = 1     # 29-31 mean the last day in shorter months

# Commands that fix formatting-type check failures. They run before a
# Mistral fix round, so a formatting failure costs no extra Mistral round.
# {files} is replaced by the files the run changed ({files:*.py} only those
# matching), so existing code isn't reformatted; a command whose pattern matches
# no changed file is skipped. Entries can also be limited to paths.
# autofix = [
#   "uv run ruff format {files:*.py}",
#   "uv run ruff check --fix {files:*.py}",
#   { cmd = "npx prettier --write {files:*.ts,*.vue}", paths = ["frontend/"] },
# ]

# When a run changes both code and tests, also run its tests against the
# original code (only the test changes applied). They should fail there;
# tests that still pass don't test the change, and the report warns.
# Only test runners count (pytest, vitest, jest, go test, `npm test`, ...),
# and only checks whose baseline passed; pytest, vitest and jest run just the
# changed test files. Name other test commands here (matched by prefix):
# test_strength = true
# test_commands = ["make test", "./scripts/run-tests.sh"]

# Once enough runs are adopted or discarded, flag kinds of task where
# delegating saved Claude less than this many times what it cost Claude
# (writing the spec, reading the report). Claude then keeps those itself.
# min_savings = 2

# Default --scope for write runs that don't pass one (usually set per task).
# scope = ["src/**"]

# When Mistral stops without finishing (missing files, no closing summary and
# no checks to tell), it is asked once to finish. 0 turns that off.
# continue_attempts = 1

# Caps per run in effective tokens: fresh input counts in full, cached input
# at a tenth, output five times (adjust with token_weights). The plugin
# enforces token_budget and max_tool_calls while Mistral works.
# 1M effective tokens is about $1.50 at Mistral Medium's prices.
[write]
token_budget = 1000000
max_tool_calls = 80
max_turns = 30
# max_price = 2.00   # optional money cap on top

[read]
token_budget = 300000
max_tool_calls = 40
max_turns = 15
